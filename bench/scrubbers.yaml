# Every scrubber on the leaderboard is registered here.
# `entry` is module:function for a Python scrubber, `command` is a stdin->stdout tool.
# `optional: true` entries are skipped (with a note) when their dependencies are missing.
scrubbers:
  - name: do-nothing
    entry: bench.baselines:do_nothing
    description: Baseline. Returns the text unchanged.

  - name: redact-everything
    entry: bench.baselines:redact_everything
    description: Baseline. Replaces the whole text with one block character.

  - name: regex-v1
    entry: scrubber.scrub:scrub_v1
    description: This repo's scrubber, version 1. One regex per type.

  - name: regex+entropy-v2
    entry: scrubber.scrub:scrub_v2
    description: This repo's scrubber, version 2. Regex + entropy + fixes found on the dev split.
